  </g>
  <g id="text_21">
   <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #8a857c" transform="translate(10.656 21.562781)">Each line is its group's yearly total divided by its own 2022 total, × 100. Comparison bridges start in 2021:</text>
   <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #8a857c" transform="translate(10.656 30.683016)">the Verrazzano was counted in one direction only until two-way tolling began in December 2020.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #8a857c" x="10.656" y="284.765484" transform="rotate(-0 10.656 284.765484)">Source: MTA Bridges and Tunnels Hourly Crossings: Beginning 2019 (data.ny.gov ebfx-2m7v), January 2019 to December 2025.</text>
  </g>
