  <g id="text_29">
   <text style="font-weight: 700; font-size: 17px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #221d1a" x="23.76" y="24.480281" transform="rotate(-0 23.76 24.480281)">Where the archived tree gaps are</text>
  </g>
  <g id="text_30">
   <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #221d1a" x="23.76" y="41.04" transform="rotate(-0 23.76 41.04)">East 138th Street · ten project analysis bays, each about 120 m · 2015 census</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #221d1a" transform="translate(23.76 332.811656)">Green: six low-count bays with modeled H/W &lt; 0.5. Gold: bay 10 needs an airflow review.</text>
   <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #221d1a" transform="translate(23.76 344.736)">Gray: three bays at or above the local mean. The mean is a comparison, not a planting standard.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #221d1a" transform="translate(23.76 360.571688)">Archived gaps identify bays worth checking; new trees and removals can change the choice.</text>
   <text style="font-size: 10px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #221d1a" transform="translate(23.76 371.412)">Verify utilities, sidewalk space and building geometry before planting.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #5b5145" transform="translate(23.76 394.208934)">Source: NYC 2015 Street Tree Census (uvpi-gqnh), project-derived 120 m bins.</text>
   <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #5b5145" transform="translate(23.76 403.4232)">H/W = building height ÷ street width, a dimensionless screening ratio; it does not model pollutant dispersion.</text>
  </g>
